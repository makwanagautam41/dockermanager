services:
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      # Persistent Floci data
      - floci-data:/app/data

      # Host Docker socket access
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  floci-data: