version: '3.8'
services:
  mysqllearningdb:
    image: mysql:8.4
    container_name: mysqllearningdb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysqlrootpassword
      MYSQL_DATABASE: mysqllearningdb
      MYSQL_USER: gautamdotdev
      MYSQL_PASSWORD: mysqllearningdbsecret
    ports:
      - 4119:3306
    volumes:
      - mysqllearningdb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -u admin -psupersecret
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  mysqllearningdb_data: null
