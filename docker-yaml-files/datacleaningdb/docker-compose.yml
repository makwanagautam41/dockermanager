version: '3.8'
services:
  datacleaningdb:
    image: mysql:8.4
    container_name: datacleaningdb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysqlrootpassword
      MYSQL_DATABASE: datacleaningdb
      MYSQL_USER: gautamdotdev
      MYSQL_PASSWORD: datacleaningdb
    ports:
      - 3256:3306
    volumes:
      - datacleaningdb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -u admin -psupersecret
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  datacleaningdb_data: null
